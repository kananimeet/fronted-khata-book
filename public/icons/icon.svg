
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Outer subtle ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" fill="none" />

  <!-- Main emblem -->
  <g filter="url(#shadow)">
    <!-- Book silhouette base -->
    <path d="M120 140 C120 120 140 110 160 110 L340 110 C364 110 384 130 384 154 L384 370 C384 390 364 402 344 402 L160 402 C138 402 120 384 120 362 Z" fill="url(#bookGradient)" />

    <!-- Spine strip -->
    <path d="M120 140 C120 120 140 110 160 110 L195 110 L195 402 L160 402 C138 402 120 384 120 362 Z" fill="#2563eb" opacity="0.9" />

    <!-- Indian Rupee symbol on the book cover -->
    <g fill="#1e3a8a" transform="translate(235, 175) scale(2.2)">
      <!-- Top horizontal bar -->
      <rect x="0" y="0" width="40" height="7" rx="3.5" />
      <!-- Second horizontal bar -->
      <rect x="0" y="16" width="34" height="7" rx="3.5" />
      <!-- Vertical and curve -->
      <path d="M12 0 L12 40 C22 40 30 34 30 24 C30 14 22 8 12 8" stroke="#1e3a8a" stroke-width="7" stroke-linecap="round" fill="none" />
      <!-- Diagonal leg -->
      <line x1="16" y1="36" x2="38" y2="70" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round" />
    </g>
  </g>

  <!-- Small star / sparkle badge -->
  <circle cx="370" cy="140" r="28" fill="#f59e0b" filter="url(#shadow)" />
  <path d="M370 124 L374 136 L386 140 L374 144 L370 156 L366 144 L354 140 L366 136 Z" fill="#ffffff" />
</svg>
